# src/main/resources/application.yml

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        database:
          include: db

  health:
    db:
      enabled: true

spring:
  config:
    import: "optional:file:./.env[.properties]"

  application:
    name: AcceptIt

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:acceptit_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  api-url: "https://api.openai.com/v1/chat/completions"

#추후 추가할 예정, 추가 이후에는 gitignore을 활용해 따로 제외 필요
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Swagger/OpenAPI for local development (set SWAGGER_ENABLED=false to disable).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  packages-to-scan: com.debate.game.controller
  paths-to-match: /api/**
