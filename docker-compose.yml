version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: AcceptIt_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: AcceptIt.db
      MYSQL_USER: debate_user #여기에 각자의 SQL ID 입력, 추후 Group화 진행
      MYSQL_PASSWORD: debate_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data: