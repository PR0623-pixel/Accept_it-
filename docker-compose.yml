services:
  mysql-db:
    image: mysql:8.0
    container_name: AcceptIt_db
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw123
      MYSQL_DATABASE: acceptit_db
      MYSQL_USER: acceptit_user
      MYSQL_PASSWORD: userpw123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema-legacy.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  mysql_data:
