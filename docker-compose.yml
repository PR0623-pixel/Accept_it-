version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: debate_game_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: debate_db
      MYSQL_USER: debate_user
      MYSQL_PASSWORD: debate_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data: