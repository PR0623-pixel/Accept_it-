# src/main/resources/application.yml

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        database:
          include: db

  health:
    db:
      enabled: true

spring:
  application:
    name: AcceptIt

  datasource:
    url: jdbc:mysql://localhost:3307/${DB_NAME:acceptit_db}
    username: acceptit_user
    password: userpw123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  api-url: "https://api.openai.com/v1/chat/completions"

#추후 추가할 예정, 추가 이후에는 gitignore을 활용해 따로 제외 필요
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
